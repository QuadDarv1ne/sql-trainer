<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Database cylinder -->
  <g transform="translate(68, 55)">
    <!-- Cylinder body -->
    <path d="M10,40 L10,120 C10,135 55,150 100,150 C145,150 190,135 190,120 L190,40 Z"
          fill="url(#cylinder)" stroke="#64748b" stroke-width="2"/>

    <!-- Cylinder top ellipse -->
    <ellipse cx="100" cy="40" rx="90" ry="25"
             fill="url(#top)" stroke="#64748b" stroke-width="2"/>

    <!-- Disk lines -->
    <path d="M10,70 C10,85 55,100 100,100 C145,100 190,85 190,70"
          fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.5"/>
    <path d="M10,100 C10,115 55,130 100,130 C145,130 190,115 190,100"
          fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.5"/>

    <!-- SQL text -->
    <text x="100" y="105" font-family="monospace" font-size="42" font-weight="bold"
          text-anchor="middle" fill="#4f46e5">SQL</text>
  </g>

  <!-- Decorative dots -->
  <circle cx="45" cy="185" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="210" cy="70" r="4" fill="#c4b5fd" opacity="0.8"/>
  <circle cx="200" cy="180" r="5" fill="#818cf8" opacity="0.5"/>
</svg>
