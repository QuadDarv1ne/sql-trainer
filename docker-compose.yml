services:
  sql-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/users.db
      # NextAuth variables — configure via .env or docker-compose.override.yml
      - AUTH_SECRET=${AUTH_SECRET:-changeme-in-production}
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - sqlite-data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL database (uncomment to use)
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: sqltrainer
  #     POSTGRES_PASSWORD: changeme
  #     POSTGRES_DB: sqltrainer
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  sqlite-data:
  # pgdata:
