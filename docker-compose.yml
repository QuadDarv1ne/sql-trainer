services:
  sql-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/users.db
      # NextAuth variables — configure via .env or docker-compose.override.yml
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme-in-production}
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - sqlite-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL database (uncomment to use)
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: sqltrainer
  #     POSTGRES_PASSWORD: changeme
  #     POSTGRES_DB: sqltrainer
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  sqlite-data:
  # pgdata:
