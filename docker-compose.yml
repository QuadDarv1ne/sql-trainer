services:
  sql-trainer:
    build: .
    container_name: sql-trainer
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AUTH_SECRET=${AUTH_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Optional: PostgreSQL for real database queries
  # Start with: docker compose --profile databases up
  postgres:
    image: postgres:16-alpine
    container_name: sql-trainer-postgres
    profiles: ["databases"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sql_trainer
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sql_trainer_secure_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d sql_trainer"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Optional: ClickHouse for analytical queries
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: sql-trainer-clickhouse
    profiles: ["databases"]
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhousedata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  clickhousedata:
