name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prevent forks from running this workflow
pull_request_target:
  branches: [main]

jobs:
  build:
    # Only run for the original repository, not forks
    if: github.repository == 'dupleymi/sql-trainer'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test:ci
