name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow workflow runs from fork PRs (with limited permissions)
permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage
        continue-on-error: true

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          npm run analyze 2>&1 | tee bundle-report.txt
          echo "Bundle analysis complete. Check artifacts for details."

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-report
          path: bundle-report.txt
          retention-days: 30

      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E tests (multi-browser)
        run: npm run test:e2e
        continue-on-error: true
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/ms-playwright
